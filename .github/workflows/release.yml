name: release

# `make deploy` migrates the changelog, tags, and pushes from a workstation. This
# picks the tag up and delegates to armcknight/workflows' reusable release
# pipeline, which publishes the GitHub release from that changelog section.
#
# There is no artifact to build or upload: dependents resolve this package
# straight from the git tag, so the tag is the release.

on:
  push:
    tags:
    # prepare-release names the tag after the version file exactly — bare, with
    # no `v` prefix. A release candidate carries an `-rc.<n>` suffix.
    - '[0-9]+.[0-9]+.[0-9]+'
    - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    permissions:
      contents: write
    uses: armcknight/workflows/.github/workflows/github-release.yml@2
